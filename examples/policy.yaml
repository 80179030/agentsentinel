# AgentSentinel example policy config.
# Load with: from agentsentinel import load_config_file; cfg = load_config_file("policy.yaml")

tools:
  - name: search_web
    description: Search the web for information.
    parameters:
      type: object
      properties:
        query:
          type: string
        lang:
          type: string
          enum: [en, zh]
      required: [query]

  - name: run_shell
    description: Run a shell command.
    parameters:
      type: object
      properties:
        command:
          type: string
      required: [command]
    requires_approval: true

policy:
  denylist: [admin_panel]
  approved_tools: []
  sensitive_patterns:
    - "DROP\\s+TABLE"
    - "rm\\s+-rf"
